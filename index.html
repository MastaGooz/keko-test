<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Colore la barre du navigateur aux teintes du jeu : tant qu'on reste
         dans un onglet, elle cesse au moins d'etre un bandeau noir. -->
    <meta name="theme-color" content="#16161a" />
    <!-- Installee sur l'ecran d'accueil, la page s'ouvre SANS barre du tout.
         C'est la seule facon de recuperer cette hauteur : une page web dans
         un onglet ne peut pas masquer la chrome du navigateur. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icone.svg" />
    <link rel="apple-touch-icon" href="./icone.svg" />
    <!-- LA SEULE RESSOURCE CHARGEE DEPUIS L'EXTERIEUR. La borne du projet etait
         « aucune police telechargee » ; Keko l'a levee lui-meme (« police trop
         simple ») et un serif systeme n'existe pas sur Android. Deux polices,
         une ligne ; sans reseau, Georgia prend le relais. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Keko" />
    <title>Keko test</title>
  </head>
  <body>
    <!-- Le jeu est en paysage uniquement. On ne peut pas forcer l'orientation
         depuis une page web — le verrouillage exige le plein écran et n'existe
         pas sur iPhone — donc on demande, en disant quoi faire si rien ne
         tourne. -->
    <div class="tourne" aria-hidden="true">
      <svg viewBox="0 0 64 64" class="tourne-icone" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <rect x="21" y="6" width="22" height="38" rx="3" />
        <path d="M28 40h8" />
        <path d="M14 46a22 22 0 0 0 36 0" />
        <path d="M8 40l6 7 7-5" />
      </svg>
      <p class="tourne-titre">Tourne ton téléphone</p>
      <p class="tourne-note">
        Le jeu se joue en paysage. Si l'écran ne pivote pas, désactive le
        verrouillage de rotation de ton téléphone.
      </p>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
