<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Colore la barre du navigateur aux teintes du jeu : tant qu'on reste
         dans un onglet, elle cesse au moins d'etre un bandeau noir. -->
    <meta name="theme-color" content="#16161a" />
    <!-- Installee sur l'ecran d'accueil, la page s'ouvre SANS barre du tout.
         C'est la seule facon de recuperer cette hauteur : une page web dans
         un onglet ne peut pas masquer la chrome du navigateur. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icone.svg" />
    <link rel="apple-touch-icon" href="./icone.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Keko" />
    <title>Keko test</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
