<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Tornade : un tourbillon d'acier, trois lames emportées dans une spirale
       autour d'un oeil de lumière. Frappe tous les corps, fort. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#4a4160"/>
      <stop offset="0.5" stop-color="#241f36"/>
      <stop offset="1" stop-color="#0d0b16"/>
    </radialGradient>
    <radialGradient id="oeil" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.25" stop-color="#cfd9ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#cfd9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f7f4"/>
      <stop offset="0.5" stop-color="#c7d3cf"/>
      <stop offset="0.52" stop-color="#7d8c89"/>
      <stop offset="1" stop-color="#4e5c5a"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f4d"/>
      <stop offset="0.5" stop-color="#1f2423"/>
      <stop offset="1" stop-color="#0d1110"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0d0b16" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0b16" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="680" height="1000" fill="url(#ciel)"/>
  <circle cx="340" cy="400" r="260" fill="url(#oeil)"/>

  <!-- la spirale : des faucilles de plus en plus larges autour du centre -->
  <g fill="#e6ecff" transform="translate(340 400)">
    <path d="M-60 -40 C -20 -120, 90 -110, 130 -30 C 80 -80, 0 -80, -50 -30 Z" opacity="0.95"/>
    <path d="M100 60 C 60 150, -80 150, -140 50 C -70 110, 40 110, 90 40 Z" opacity="0.9"/>
    <path d="M-170 -90 C -120 -230, 120 -250, 230 -120 C 120 -200, -90 -190, -160 -70 Z" opacity="0.85"/>
    <path d="M200 120 C 150 260, -130 280, -250 140 C -130 230, 110 210, 190 100 Z" opacity="0.8"/>
    <path d="M-260 -150 C -180 -330, 200 -360, 320 -190 C 200 -300, -140 -290, -240 -130 Z" opacity="0.6"/>
    <path d="M280 190 C 200 370, -200 400, -330 220 C -200 330, 180 310, 270 170 Z" opacity="0.55"/>
  </g>
  <g fill="#e6ecff" opacity="0.4" filter="url(#flou)" transform="translate(340 400)">
    <path d="M-170 -90 C -120 -230, 120 -250, 230 -120 C 120 -200, -90 -190, -160 -70 Z"/>
    <path d="M200 120 C 150 260, -130 280, -250 140 C -130 230, 110 210, 190 100 Z"/>
  </g>

  <!-- trois lames emportées, tangentes à la spirale -->
  <g transform="translate(340 400)">
    <g transform="rotate(20) translate(0 -230) rotate(90)">
      <polygon points="0,-130 -16,-100 -17,60 17,60 16,-100" fill="url(#acier)"/>
      <path d="M-44 62 L44 62 L44 76 L-44 76 Z" fill="url(#fer)"/>
      <rect x="-8" y="76" width="16" height="50" fill="#5d3a20"/>
    </g>
    <g transform="rotate(140) translate(0 -230) rotate(90)">
      <polygon points="0,-130 -16,-100 -17,60 17,60 16,-100" fill="url(#acier)"/>
      <path d="M-44 62 L44 62 L44 76 L-44 76 Z" fill="url(#fer)"/>
      <rect x="-8" y="76" width="16" height="50" fill="#5d3a20"/>
    </g>
    <g transform="rotate(260) translate(0 -230) rotate(90)">
      <polygon points="0,-130 -16,-100 -17,60 17,60 16,-100" fill="url(#acier)"/>
      <path d="M-44 62 L44 62 L44 76 L-44 76 Z" fill="url(#fer)"/>
      <rect x="-8" y="76" width="16" height="50" fill="#5d3a20"/>
    </g>
  </g>

  <!-- l'oeil -->
  <circle cx="340" cy="400" r="26" fill="#fff6e0"/>
  <circle cx="340" cy="400" r="60" fill="#fff6e0" opacity="0.35" filter="url(#flou)"/>

  <g fill="#f4efe0">
    <polygon points="118,270 134,262 142,290 124,296" opacity="0.8"/>
    <polygon points="560,560 576,556 572,582" opacity="0.7"/>
    <circle cx="90" cy="560" r="3" opacity="0.7"/><circle cx="600" cy="150" r="2.5" opacity="0.6"/>
    <circle cx="140" cy="120" r="2" opacity="0.5"/><circle cx="520" cy="660" r="2" opacity="0.5"/>
  </g>
  <g fill="#b9a6ff" opacity="0.6">
    <circle cx="200" cy="640" r="3"/><circle cx="480" cy="90" r="2.5"/><circle cx="60" cy="400" r="2.5"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
