<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Rempart : un pavois haut à crête crénelée, planté devant un mur. Le
       gros bloc du Plastron. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#2c3d5c"/>
      <stop offset="0.5" stop-color="#15213a"/>
      <stop offset="1" stop-color="#080d18"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f0ee"/>
      <stop offset="0.5" stop-color="#b0bdba"/>
      <stop offset="0.52" stop-color="#6d7c79"/>
      <stop offset="1" stop-color="#3a4644"/>
    </linearGradient>
    <linearGradient id="champ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5f90"/>
      <stop offset="0.6" stop-color="#22355a"/>
      <stop offset="1" stop-color="#0f1a30"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="0.55" stop-color="#c9a04e"/>
      <stop offset="1" stop-color="#7a5a22"/>
    </linearGradient>
    <linearGradient id="pierre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#080d18" stop-opacity="0"/>
      <stop offset="1" stop-color="#080d18" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="29"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="ombre"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- PAS DE CIEL ICI : le fond commun de toutes les cartes est
       `public/Background.png`, peint SOUS ce dessin. Le dégradé « ciel »
       reste défini au-dessus — le remettre en `<rect>` plein format rend
       à la carte son fond de famille. -->

  <!-- le mur derrière -->
  <rect x="0" y="520" width="680" height="300" fill="url(#pierre)"/>
  <g stroke="#080d18" stroke-width="4" opacity="0.7">
    <line x1="0" y1="580" x2="680" y2="580"/><line x1="0" y1="640" x2="680" y2="640"/><line x1="0" y1="700" x2="680" y2="700"/>
    <line x1="120" y1="520" x2="120" y2="580"/><line x1="260" y1="520" x2="260" y2="580"/><line x1="420" y1="520" x2="420" y2="580"/><line x1="580" y1="520" x2="580" y2="580"/>
    <line x1="60" y1="580" x2="60" y2="640"/><line x1="190" y1="580" x2="190" y2="640"/><line x1="490" y1="580" x2="490" y2="640"/><line x1="630" y1="580" x2="630" y2="640"/>
  </g>
  <!-- les créneaux du mur -->
  <g fill="url(#pierre)">
    <rect x="0" y="480" width="80" height="44"/><rect x="150" y="480" width="80" height="44"/>
    <rect x="450" y="480" width="80" height="44"/><rect x="600" y="480" width="80" height="44"/>
  </g>

  <!-- l'ombre du pavois -->
  <path d="M196 220 L484 220 L484 640 Q484 700 356 740 Q228 700 228 640 Z" fill="#040710" opacity="0.6" filter="url(#ombre)"/>

  <!-- le pavois : haut, à crête crénelée, arrondi en bas -->
  <path d="M180 200 L228 200 L228 232 L276 232 L276 200 L324 200 L324 232 L372 232 L372 200 L420 200 L420 232 L468 232 L468 200 L500 200 L500 620 Q500 690 340 730 Q180 690 180 620 Z" fill="url(#acier)"/>
  <path d="M206 250 L474 250 L474 610 Q474 665 340 700 Q206 665 206 610 Z" fill="#0f1a30"/>
  <path d="M212 256 L468 256 L468 608 Q468 660 340 693 Q212 660 212 608 Z" fill="url(#champ)"/>
  <!-- les bandes de fer -->
  <g fill="url(#acier)" opacity="0.9">
    <rect x="206" y="380" width="268" height="18"/>
    <rect x="206" y="520" width="268" height="18"/>
  </g>
  <g fill="url(#or)">
    <circle cx="232" cy="389" r="7"/><circle cx="448" cy="389" r="7"/>
    <circle cx="232" cy="529" r="7"/><circle cx="448" cy="529" r="7"/>
    <circle cx="340" cy="389" r="7"/><circle cx="340" cy="529" r="7"/>
  </g>
  <!-- l'emblème : une tour -->
  <path d="M310 300 L370 300 L370 316 L356 316 L356 336 L324 336 L324 316 L310 316 Z M318 340 L362 340 L362 360 L318 360 Z" fill="url(#or)"/>
  <!-- le reflet du haut -->
  <path d="M212 256 L468 256 L468 300 Q340 280 212 300 Z" fill="#ffffff" opacity="0.1"/>

  <g fill="#e9f0ff" opacity="0.6">
    <circle cx="90" cy="180" r="2.5"/><circle cx="600" cy="140" r="2"/>
    <circle cx="560" cy="80" r="2"/><circle cx="120" cy="80" r="2"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
