<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Reliquaire : une châsse à pignon, un toit d'or, une fenêtre de rubis
       sur ce qu'elle garde. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a2430"/>
      <stop offset="0.5" stop-color="#26111a"/>
      <stop offset="1" stop-color="#0e0609"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf6a" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#ffcf6a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.4" stop-color="#e2b95c"/>
      <stop offset="0.7" stop-color="#a9782c"/>
      <stop offset="1" stop-color="#5e3f12"/>
    </linearGradient>
    <linearGradient id="orCote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b95c"/>
      <stop offset="1" stop-color="#7a5620"/>
    </linearGradient>
    <linearGradient id="ebene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#160b06"/>
    </linearGradient>
    <radialGradient id="rubis" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffb0a8"/>
      <stop offset="0.4" stop-color="#d9303c"/>
      <stop offset="1" stop-color="#5a0f18"/>
    </radialGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0e0609" stop-opacity="0"/>
      <stop offset="1" stop-color="#0e0609" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="53"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- PAS DE CIEL ICI : le fond commun de toutes les cartes est
       `public/Background.png`, peint SOUS ce dessin. Le dégradé « ciel »
       reste défini au-dessus — le remettre en `<rect>` plein format rend
       à la carte son fond de famille. -->
  <circle cx="340" cy="400" r="330" fill="url(#halo)"/>
  <ellipse cx="340" cy="610" rx="230" ry="28" fill="#050203" opacity="0.7" filter="url(#flou)"/>

  <!-- le socle -->
  <rect x="120" y="560" width="440" height="34" rx="6" fill="url(#or)"/>
  <!-- le corps d'ébène -->
  <rect x="150" y="380" width="380" height="190" fill="url(#ebene)"/>
  <!-- les montants d'or -->
  <g fill="url(#orCote)">
    <rect x="150" y="380" width="26" height="190"/><rect x="504" y="380" width="26" height="190"/>
    <rect x="330" y="380" width="20" height="190"/>
  </g>
  <!-- le toit à pignon -->
  <path d="M130 386 L340 240 L550 386 Z" fill="url(#or)"/>
  <path d="M130 386 L340 240 L550 386 Z" fill="none" stroke="#5e3f12" stroke-width="3" opacity="0.6"/>
  <path d="M170 380 L340 262 L510 380 Z" fill="#a9782c" opacity="0.5"/>
  <!-- la crête et la croix -->
  <rect x="332" y="180" width="16" height="70" rx="4" fill="url(#or)"/>
  <rect x="308" y="200" width="64" height="16" rx="4" fill="url(#or)"/>
  <!-- les fenêtres de rubis -->
  <g fill="url(#rubis)">
    <path d="M210 420 L250 420 L250 520 L230 540 L210 520 Z"/>
    <path d="M430 420 L470 420 L470 520 L450 540 L430 520 Z"/>
  </g>
  <g fill="none" stroke="url(#or)" stroke-width="5">
    <path d="M210 420 L250 420 L250 520 L230 540 L210 520 Z"/>
    <path d="M430 420 L470 420 L470 520 L450 540 L430 520 Z"/>
  </g>
  <!-- les clous -->
  <g fill="#fff1c2" opacity="0.8">
    <circle cx="163" cy="400" r="5"/><circle cx="163" cy="480" r="5"/><circle cx="163" cy="550" r="5"/>
    <circle cx="517" cy="400" r="5"/><circle cx="517" cy="480" r="5"/><circle cx="517" cy="550" r="5"/>
    <circle cx="340" cy="400" r="5"/><circle cx="340" cy="480" r="5"/><circle cx="340" cy="550" r="5"/>
  </g>
  <!-- la lueur qui sort des fenêtres -->
  <g fill="#ff6a5a" opacity="0.3" filter="url(#flou)">
    <ellipse cx="230" cy="480" rx="40" ry="70"/><ellipse cx="450" cy="480" rx="40" ry="70"/>
  </g>

  <g fill="#ffe9a8" opacity="0.7">
    <circle cx="110" cy="200" r="3"/><circle cx="580" cy="180" r="2.5"/>
    <circle cx="70" cy="600" r="2"/><circle cx="620" cy="620" r="2.5"/>
    <path d="M150 160 L154 174 L168 178 L154 182 L150 196 L146 182 L132 178 L146 174 Z"/>
    <path d="M560 300 L563 310 L573 313 L563 316 L560 326 L557 316 L547 313 L557 310 Z"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
