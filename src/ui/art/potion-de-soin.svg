<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Potion de soin : trois flacons en rang, la liqueur verte, sur une
       étagère. L'objet : il donne UNE carte à trois gorgées. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#25402f"/>
      <stop offset="0.5" stop-color="#11221a"/>
      <stop offset="1" stop-color="#060d0a"/>
    </radialGradient>
    <radialGradient id="lueur" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7cf59a" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7cf59a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7cf59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liqueur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ffb8"/>
      <stop offset="0.5" stop-color="#4fd87a"/>
      <stop offset="1" stop-color="#1f7a48"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="liege" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98a55"/>
      <stop offset="0.5" stop-color="#8a5f34"/>
      <stop offset="1" stop-color="#4f3419"/>
    </linearGradient>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#241408"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#060d0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#060d0a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="107"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="10"/></filter>
    <!-- un flacon, réutilisé trois fois -->
    <g id="flacon">
      <path d="M-30 -140 L30 -140 L30 -80 Q90 -40 90 50 Q90 150 0 150 Q-90 150 -90 50 Q-90 -40 -30 -80 Z" fill="#0b1a12"/>
      <clipPath id="dedans"><path d="M-30 -140 L30 -140 L30 -80 Q90 -40 90 50 Q90 150 0 150 Q-90 150 -90 50 Q-90 -40 -30 -80 Z"/></clipPath>
      <g clip-path="url(#dedans)">
        <rect x="-100" y="-20" width="200" height="180" fill="url(#liqueur)"/>
        <ellipse cx="0" cy="-20" rx="96" ry="12" fill="#c8ffd4" opacity="0.8"/>
        <g fill="#e8fff0" opacity="0.7"><circle cx="-30" cy="80" r="5"/><circle cx="30" cy="50" r="4"/><circle cx="0" cy="110" r="3"/><circle cx="40" cy="100" r="4"/></g>
      </g>
      <path d="M-30 -140 L30 -140 L30 -80 Q90 -40 90 50 Q90 150 0 150 Q-90 150 -90 50 Q-90 -40 -30 -80 Z" fill="url(#verre)"/>
      <path d="M-62 -10 Q-72 40 -66 100" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35"/>
      <rect x="-34" y="-150" width="68" height="16" rx="5" fill="#0b1a12"/>
      <rect x="-24" y="-192" width="48" height="48" rx="8" fill="url(#liege)"/>
      <path d="M-30 -132 Q0 -122 30 -132" stroke="#c9a04e" stroke-width="3" fill="none"/>
    </g>
  </defs>

  <rect width="680" height="1000" fill="url(#ciel)"/>
  <circle cx="340" cy="440" r="340" fill="url(#lueur)"/>

  <!-- l'étagère -->
  <rect x="60" y="600" width="560" height="26" rx="4" fill="url(#bois)"/>
  <rect x="60" y="600" width="560" height="6" fill="#8a5f34" opacity="0.5"/>
  <ellipse cx="340" cy="600" rx="260" ry="20" fill="#020604" opacity="0.6" filter="url(#flou)"/>

  <!-- les trois flacons : les deux du bord plus petits et en retrait -->
  <use href="#flacon" transform="translate(170 470) scale(0.78)"/>
  <use href="#flacon" transform="translate(510 470) scale(0.78)"/>
  <use href="#flacon" transform="translate(340 450)"/>
  <!-- la lueur qui monte des liqueurs -->
  <ellipse cx="340" cy="520" rx="200" ry="80" fill="#7cf59a" opacity="0.2" filter="url(#flou)"/>

  <g fill="#c8ffd4" opacity="0.6">
    <circle cx="120" cy="240" r="2.5"/><circle cx="560" cy="200" r="2"/>
    <circle cx="90" cy="520" r="2"/><circle cx="600" cy="520" r="2.5"/>
    <circle cx="500" cy="120" r="2"/><circle cx="200" cy="120" r="2"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
