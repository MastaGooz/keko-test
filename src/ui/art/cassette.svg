<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Cassette : un petit coffret bombé, cerclé de fer, la serrure d'or. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a2430"/>
      <stop offset="0.5" stop-color="#26111a"/>
      <stop offset="1" stop-color="#0e0609"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf6a" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffcf6a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.4" stop-color="#e2b95c"/>
      <stop offset="0.7" stop-color="#a9782c"/>
      <stop offset="1" stop-color="#5e3f12"/>
    </linearGradient>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#3a2012"/>
    </linearGradient>
    <linearGradient id="couvercle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6238"/>
      <stop offset="1" stop-color="#5a331c"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6f72"/>
      <stop offset="0.5" stop-color="#2b3033"/>
      <stop offset="1" stop-color="#14181a"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0e0609" stop-opacity="0"/>
      <stop offset="1" stop-color="#0e0609" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="67"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- PAS DE CIEL ICI : le fond commun de toutes les cartes est
       `public/Background.png`, peint SOUS ce dessin. Le dégradé « ciel »
       reste défini au-dessus — le remettre en `<rect>` plein format rend
       à la carte son fond de famille. -->
  <circle cx="340" cy="400" r="330" fill="url(#halo)"/>
  <ellipse cx="340" cy="620" rx="240" ry="30" fill="#050203" opacity="0.7" filter="url(#flou)"/>

  <!-- le corps -->
  <rect x="130" y="400" width="420" height="200" rx="8" fill="url(#bois)"/>
  <!-- le couvercle bombé -->
  <path d="M130 400 L130 350 Q130 270 210 270 L470 270 Q550 270 550 350 L550 400 Z" fill="url(#couvercle)"/>
  <path d="M130 400 L550 400" stroke="#14181a" stroke-width="6"/>
  <!-- les planches -->
  <g stroke="#14181a" stroke-width="3" opacity="0.5">
    <line x1="130" y1="470" x2="550" y2="470"/><line x1="130" y1="540" x2="550" y2="540"/>
    <path d="M150 330 Q340 300 530 330"/>
  </g>
  <!-- les cercles de fer -->
  <g fill="url(#fer)">
    <path d="M190 270 Q170 270 170 300 L170 600 L210 600 L210 300 Q210 270 190 270 Z"/>
    <path d="M490 270 Q470 270 470 300 L470 600 L510 600 L510 300 Q510 270 490 270 Z"/>
    <rect x="130" y="392" width="420" height="16"/>
    <rect x="130" y="584" width="420" height="16"/>
  </g>
  <g fill="#fff1c2" opacity="0.7">
    <circle cx="190" cy="320" r="5"/><circle cx="190" cy="440" r="5"/><circle cx="190" cy="570" r="5"/>
    <circle cx="490" cy="320" r="5"/><circle cx="490" cy="440" r="5"/><circle cx="490" cy="570" r="5"/>
  </g>
  <!-- la serrure -->
  <path d="M300 360 L380 360 L380 460 Q380 480 360 480 L320 480 Q300 480 300 460 Z" fill="url(#or)"/>
  <path d="M300 360 L380 360 L380 460 Q380 480 360 480 L320 480 Q300 480 300 460 Z" fill="none" stroke="#5e3f12" stroke-width="3" opacity="0.6"/>
  <circle cx="340" cy="410" r="12" fill="#14181a"/>
  <rect x="334" y="410" width="12" height="30" fill="#14181a"/>
  <!-- les poignées latérales -->
  <path d="M130 480 Q100 480 100 510 Q100 540 130 540" fill="none" stroke="url(#or)" stroke-width="12" stroke-linecap="round"/>
  <path d="M550 480 Q580 480 580 510 Q580 540 550 540" fill="none" stroke="url(#or)" stroke-width="12" stroke-linecap="round"/>
  <!-- le reflet du couvercle -->
  <path d="M170 350 Q170 300 220 290 L300 290 Q220 300 210 350 Z" fill="#ffffff" opacity="0.15"/>

  <g fill="#ffe9a8" opacity="0.7">
    <circle cx="110" cy="200" r="3"/><circle cx="580" cy="180" r="2.5"/>
    <circle cx="70" cy="600" r="2"/><circle cx="620" cy="640" r="2.5"/>
    <path d="M120 300 L124 314 L138 318 L124 322 L120 336 L116 322 L102 318 L116 314 Z"/>
    <path d="M580 240 L583 250 L593 253 L583 256 L580 266 L577 256 L567 253 L577 250 Z"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
