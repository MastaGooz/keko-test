<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Le dos de carte : une nuit sombre, un médaillon d'or au centre, un
       semis de losanges. Il n'a rien à montrer, seulement une matière. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2c2f3a"/>
      <stop offset="0.5" stop-color="#181a22"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b95c"/>
      <stop offset="1" stop-color="#7a5620"/>
    </linearGradient>
    <pattern id="semis" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 8 L72 40 L40 72 L8 40 Z" fill="none" stroke="#c9a04e" stroke-width="2" opacity="0.18"/>
      <circle cx="40" cy="40" r="3" fill="#c9a04e" opacity="0.2"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="113"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="680" height="1000" fill="url(#ciel)"/>
  <rect width="680" height="1000" fill="url(#semis)"/>
  <rect x="40" y="40" width="600" height="920" rx="16" fill="none" stroke="url(#or)" stroke-width="4" opacity="0.6"/>
  <rect x="56" y="56" width="568" height="888" rx="10" fill="none" stroke="url(#or)" stroke-width="2" opacity="0.4"/>
  <g transform="translate(340 500)">
    <circle r="130" fill="#0a0b10" opacity="0.6"/>
    <circle r="130" fill="none" stroke="url(#or)" stroke-width="8"/>
    <circle r="104" fill="none" stroke="url(#or)" stroke-width="3" opacity="0.6"/>
    <path d="M0 -80 L24 -24 L80 0 L24 24 L0 80 L-24 24 L-80 0 L-24 -24 Z" fill="url(#or)"/>
    <circle r="18" fill="#0a0b10"/>
  </g>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
