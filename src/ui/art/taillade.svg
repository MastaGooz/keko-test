<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Taillade : un arc de coupe qui traverse le soleil rouge de bas en haut,
       la lame au bout. Le coup moyen du Glaive : ample, tranchant. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a4a44"/>
      <stop offset="0.45" stop-color="#1d2a2b"/>
      <stop offset="1" stop-color="#0c1315"/>
    </radialGradient>
    <radialGradient id="soleil" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#e8785a"/>
      <stop offset="0.55" stop-color="#c2432f"/>
      <stop offset="1" stop-color="#7e2723"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#d9553a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d9553a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f7f4"/>
      <stop offset="0.5" stop-color="#c7d3cf"/>
      <stop offset="0.52" stop-color="#7d8c89"/>
      <stop offset="1" stop-color="#4e5c5a"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f4d"/>
      <stop offset="0.5" stop-color="#1f2423"/>
      <stop offset="1" stop-color="#0d1110"/>
    </linearGradient>
    <linearGradient id="cuir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.5" stop-color="#5d3a20"/>
      <stop offset="1" stop-color="#2f1c0f"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff3d6"/>
      <stop offset="0.7" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0c1315" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c1315" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="ombre"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="680" height="1000" fill="url(#ciel)"/>
  <circle cx="360" cy="360" r="320" fill="url(#halo)"/>
  <circle cx="360" cy="360" r="215" fill="url(#soleil)"/>
  <path d="M158 420 A215 215 0 0 0 562 420 A240 240 0 0 1 158 420 Z" fill="#5a1d1c" opacity="0.5" filter="url(#flou)"/>

  <!-- l'arc de coupe : une faucille de lumière, du bas gauche au haut droit -->
  <path d="M110 700 C 140 420, 380 200, 600 130 C 420 260, 220 470, 130 690 Z" fill="url(#trait)" opacity="0.95"/>
  <path d="M110 700 C 140 420, 380 200, 600 130 C 420 260, 220 470, 130 690 Z" fill="#fff3d6" opacity="0.5" filter="url(#flou)"/>
  <!-- deux entailles noires laissées dans le disque -->
  <g fill="#0c1315" opacity="0.9">
    <path d="M300 200 Q330 360 260 520 Q316 360 300 200 Z"/>
    <path d="M430 150 Q470 330 420 500 Q456 330 430 150 Z"/>
  </g>

  <!-- la lame au bout de l'arc, en haut à droite, tournée dans le sens du coup -->
  <g transform="translate(560 170) rotate(52)" opacity="0.45" filter="url(#ombre)">
    <polygon points="0,-40 -30,20 -32,250 32,250 30,20" fill="#0c1315"/>
  </g>
  <g transform="translate(548 160) rotate(52)">
    <polygon points="0,-40 -30,20 -32,250 32,250 30,20" fill="url(#acier)"/>
    <polygon points="0,-40 -3,20 -3,250 3,250 3,20" fill="#e9f0ed" opacity="0.7"/>
    <path d="M-90 254 Q-56 240 -32 250 L32 250 Q56 240 90 254 L90 282 Q56 270 32 278 L-32 278 Q-56 270 -90 282 Z" fill="url(#fer)"/>
    <rect x="-14" y="278" width="28" height="120" fill="url(#cuir)"/>
    <g stroke="#1a0f08" stroke-width="3" opacity="0.7">
      <line x1="-14" y1="296" x2="14" y2="304"/><line x1="-14" y1="320" x2="14" y2="328"/>
      <line x1="-14" y1="344" x2="14" y2="352"/><line x1="-14" y1="368" x2="14" y2="376"/>
    </g>
    <circle cx="0" cy="418" r="24" fill="url(#fer)"/>
    <circle cx="0" cy="418" r="8" fill="#c9a04e"/>
  </g>

  <!-- gouttes et éclats projetés -->
  <g fill="#f4efe0">
    <polygon points="180,470 196,462 204,490 186,496" opacity="0.8"/>
    <polygon points="240,300 254,296 250,320" opacity="0.7"/>
    <circle cx="150" cy="330" r="3" opacity="0.7"/><circle cx="470" cy="560" r="2.5" opacity="0.6"/>
    <circle cx="90" cy="200" r="2" opacity="0.5"/><circle cx="600" cy="480" r="2.5" opacity="0.5"/>
  </g>
  <g fill="#e8785a" opacity="0.7">
    <circle cx="120" cy="620" r="4"/><circle cx="500" cy="60" r="3"/><circle cx="60" cy="440" r="2.5"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
