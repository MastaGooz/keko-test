<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Fendre : la grande lame plantée d'un coup dans un rocher, qui se
       fend. Un seul corps, mais lourdement. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3b3f4e"/>
      <stop offset="0.5" stop-color="#1e2130"/>
      <stop offset="1" stop-color="#0c0e16"/>
    </radialGradient>
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ff9a4a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f7f4"/>
      <stop offset="0.5" stop-color="#c7d3cf"/>
      <stop offset="0.52" stop-color="#7d8c89"/>
      <stop offset="1" stop-color="#4e5c5a"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f4d"/>
      <stop offset="0.5" stop-color="#1f2423"/>
      <stop offset="1" stop-color="#0d1110"/>
    </linearGradient>
    <linearGradient id="cuir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.5" stop-color="#5d3a20"/>
      <stop offset="1" stop-color="#2f1c0f"/>
    </linearGradient>
    <linearGradient id="roc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6f78"/>
      <stop offset="0.5" stop-color="#3d414b"/>
      <stop offset="1" stop-color="#1a1c24"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0c0e16" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0e16" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="680" height="1000" fill="url(#ciel)"/>

  <!-- le rocher -->
  <path d="M90 720 Q60 600 160 540 Q240 470 340 490 Q460 470 540 540 Q640 600 600 720 Z" fill="url(#roc)"/>
  <path d="M160 540 Q240 470 340 490 Q460 470 540 540 Q440 520 340 530 Q240 520 160 540 Z" fill="#8a8f9a" opacity="0.5"/>
  <!-- la fente -->
  <path d="M340 500 L326 560 L350 610 L330 680 L346 720 L358 680 L338 610 L360 560 L346 500 Z" fill="#0c0e16"/>
  <path d="M326 560 L250 600 M350 610 L430 640 M330 680 L270 700" stroke="#0c0e16" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- l'éclat de l'impact -->
  <circle cx="340" cy="505" r="150" fill="url(#impact)"/>
  <g fill="#ffe9c6" opacity="0.9">
    <polygon points="340,505 150,430 340,490"/>
    <polygon points="340,505 530,430 340,490"/>
    <polygon points="340,505 200,330 350,480"/>
    <polygon points="340,505 480,330 330,480"/>
  </g>

  <!-- les traînées de la chute, verticales -->
  <g fill="#ffe9c6" opacity="0.5">
    <path d="M300 60 Q296 260 302 440 Q306 260 300 60 Z"/>
    <path d="M384 90 Q380 270 386 440 Q390 270 384 90 Z"/>
  </g>

  <!-- la grande lame, verticale, la pointe dans le roc -->
  <g transform="translate(354 40)" opacity="0.45" filter="url(#flou)">
    <polygon points="0,470 -36,400 -38,20 38,20 36,400" fill="#0c0e16"/>
  </g>
  <g transform="translate(340 30)">
    <polygon points="0,470 -36,400 -38,-30 38,-30 36,400" fill="url(#acier)"/>
    <polygon points="0,470 -3,400 -3,-30 3,-30 3,400" fill="#e9f0ed" opacity="0.7"/>
    <rect x="-8" y="0" width="16" height="360" rx="8" fill="#3f4c4a" opacity="0.5"/>
    <!-- la garde, tout en haut de l'image : le manche sort du cadre -->
    <path d="M-110 -30 Q-70 -44 -40 -34 L40 -34 Q70 -44 110 -30 L110 -2 Q70 -14 40 -6 L-40 -6 Q-70 -14 -110 -2 Z" fill="url(#fer)"/>
    <circle cx="0" cy="-18" r="12" fill="#c9a04e"/>
  </g>

  <!-- éclats de pierre -->
  <g fill="#9aa0ab">
    <polygon points="140,520 156,506 170,530 150,540" opacity="0.8"/>
    <polygon points="520,500 538,494 534,522" opacity="0.8"/>
    <polygon points="200,440 210,432 218,452" opacity="0.7"/>
    <polygon points="470,430 484,426 480,450" opacity="0.7"/>
    <circle cx="110" cy="460" r="3" opacity="0.7"/><circle cx="580" cy="470" r="3" opacity="0.7"/>
  </g>
  <g fill="#ffb066" opacity="0.7">
    <circle cx="250" cy="380" r="3"/><circle cx="440" cy="370" r="2.5"/><circle cx="600" cy="600" r="2"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
