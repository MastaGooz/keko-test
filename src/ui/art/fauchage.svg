<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Fauchage : la grande lame balaie le rang à l'horizontale, et trois
       silhouettes sombres sont prises dans l'arc. Frappe tous les corps. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3b3f4e"/>
      <stop offset="0.5" stop-color="#1e2130"/>
      <stop offset="1" stop-color="#0c0e16"/>
    </radialGradient>
    <radialGradient id="braise" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a4a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f7f4"/>
      <stop offset="0.5" stop-color="#c7d3cf"/>
      <stop offset="0.52" stop-color="#7d8c89"/>
      <stop offset="1" stop-color="#4e5c5a"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f4d"/>
      <stop offset="0.5" stop-color="#1f2423"/>
      <stop offset="1" stop-color="#0d1110"/>
    </linearGradient>
    <linearGradient id="cuir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.5" stop-color="#5d3a20"/>
      <stop offset="1" stop-color="#2f1c0f"/>
    </linearGradient>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3a"/>
      <stop offset="1" stop-color="#0c0e16"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9c6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffe9c6"/>
      <stop offset="0.75" stop-color="#ffe9c6"/>
      <stop offset="1" stop-color="#ffe9c6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0c0e16" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0e16" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="680" height="1000" fill="url(#ciel)"/>
  <ellipse cx="340" cy="560" rx="360" ry="140" fill="url(#braise)"/>

  <!-- les trois silhouettes prises dans le coup -->
  <g fill="url(#corps)">
    <path d="M150 640 Q120 560 150 500 Q170 470 200 500 Q230 560 200 640 Z"/>
    <path d="M320 660 Q280 560 320 480 Q345 445 372 480 Q410 560 372 660 Z"/>
    <path d="M500 640 Q470 560 500 500 Q520 470 550 500 Q580 560 550 640 Z"/>
  </g>
  <g fill="#ffb066">
    <circle cx="176" cy="512" r="4"/><circle cx="346" cy="490" r="5"/><circle cx="526" cy="512" r="4"/>
  </g>

  <!-- l'arc du balayage : une faucille couchée, large -->
  <path d="M40 470 C 200 380, 480 380, 650 470 C 480 420, 200 420, 60 490 Z" fill="url(#trait)" opacity="0.95"/>
  <path d="M40 470 C 200 380, 480 380, 650 470 C 480 420, 200 420, 60 490 Z" fill="#ffe9c6" opacity="0.5" filter="url(#flou)"/>

  <!-- la grande lame, à plat, la pointe à droite -->
  <g transform="translate(70 380) rotate(-6)">
    <polygon points="580,0 480,-24 -10,-24 -10,24 480,24" fill="url(#acier)"/>
    <polygon points="580,0 480,-3 -10,-3 -10,3 480,3" fill="#eef3f0" opacity="0.8"/>
    <rect x="20" y="-6" width="380" height="12" rx="6" fill="#3f4c4a" opacity="0.5"/>
    <path d="M-10 -70 Q-24 -30 -14 0 Q-24 30 -10 70 L-40 70 Q-32 30 -40 0 Q-32 -30 -40 -70 Z" fill="url(#fer)"/>
    <rect x="-150" y="-13" width="110" height="26" fill="url(#cuir)"/>
    <g stroke="#1a0f08" stroke-width="3" opacity="0.7">
      <line x1="-58" y1="-13" x2="-64" y2="13"/><line x1="-80" y1="-13" x2="-86" y2="13"/>
      <line x1="-102" y1="-13" x2="-108" y2="13"/><line x1="-124" y1="-13" x2="-130" y2="13"/>
    </g>
    <circle cx="-168" cy="0" r="22" fill="url(#fer)"/>
    <circle cx="-168" cy="0" r="8" fill="#c9a04e"/>
  </g>

  <!-- les braises soulevées -->
  <g fill="#ffb066">
    <circle cx="120" cy="420" r="3" opacity="0.8"/><circle cx="260" cy="330" r="2.5" opacity="0.7"/>
    <circle cx="430" cy="300" r="2" opacity="0.7"/><circle cx="560" cy="360" r="3" opacity="0.8"/>
    <circle cx="610" cy="560" r="2.5" opacity="0.6"/><circle cx="80" cy="580" r="2" opacity="0.6"/>
    <polygon points="230,560 242,552 250,576 236,582" opacity="0.7"/>
    <polygon points="440,590 452,586 448,608" opacity="0.6"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
