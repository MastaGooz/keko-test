<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Boire une gorgée : un flacon de verre, la liqueur verte qui luit, un
       bouchon de liège. La carte de la potion : trois gorgées, puis plus rien. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#25402f"/>
      <stop offset="0.5" stop-color="#11221a"/>
      <stop offset="1" stop-color="#060d0a"/>
    </radialGradient>
    <radialGradient id="lueur" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7cf59a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7cf59a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7cf59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liqueur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ffb8"/>
      <stop offset="0.5" stop-color="#4fd87a"/>
      <stop offset="1" stop-color="#1f7a48"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="liege" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98a55"/>
      <stop offset="0.5" stop-color="#8a5f34"/>
      <stop offset="1" stop-color="#4f3419"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#060d0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#060d0a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="flou"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="dedans">
      <path d="M296 250 L384 250 L384 330 Q470 380 470 500 Q470 640 340 640 Q210 640 210 500 Q210 380 296 330 Z"/>
    </clipPath>
  </defs>

  <!-- PAS DE CIEL ICI : le fond commun de toutes les cartes est
       `public/Background.png`, peint SOUS ce dessin. Le dégradé « ciel »
       reste défini au-dessus — le remettre en `<rect>` plein format rend
       à la carte son fond de famille. -->
  <circle cx="340" cy="470" r="330" fill="url(#lueur)"/>

  <!-- l'ombre au sol -->
  <ellipse cx="340" cy="660" rx="150" ry="26" fill="#020604" opacity="0.7" filter="url(#flou)"/>

  <!-- le flacon : le verre sombre -->
  <path d="M296 250 L384 250 L384 330 Q470 380 470 500 Q470 640 340 640 Q210 640 210 500 Q210 380 296 330 Z" fill="#0b1a12"/>
  <!-- la liqueur -->
  <g clip-path="url(#dedans)">
    <rect x="200" y="400" width="280" height="260" fill="url(#liqueur)"/>
    <ellipse cx="340" cy="400" rx="140" ry="16" fill="#c8ffd4" opacity="0.8"/>
    <!-- les bulles -->
    <g fill="#e8fff0" opacity="0.7">
      <circle cx="300" cy="560" r="7"/><circle cx="380" cy="520" r="5"/><circle cx="340" cy="600" r="4"/>
      <circle cx="270" cy="480" r="4"/><circle cx="400" cy="590" r="6"/><circle cx="360" cy="450" r="3"/>
    </g>
  </g>
  <!-- le verre par-dessus : reflets -->
  <path d="M296 250 L384 250 L384 330 Q470 380 470 500 Q470 640 340 640 Q210 640 210 500 Q210 380 296 330 Z" fill="url(#verre)"/>
  <path d="M250 400 Q236 470 244 560" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M306 268 L306 320" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <!-- le col et le bouchon -->
  <rect x="290" y="236" width="100" height="22" rx="6" fill="#0b1a12"/>
  <rect x="304" y="176" width="72" height="70" rx="10" fill="url(#liege)"/>
  <rect x="304" y="176" width="72" height="14" rx="6" fill="#d3a56f" opacity="0.6"/>
  <!-- la ficelle et l'étiquette -->
  <path d="M296 262 Q340 276 384 262" stroke="#c9a04e" stroke-width="4" fill="none"/>
  <rect x="330" y="290" width="60" height="30" rx="4" fill="#e6d7b2" transform="rotate(8 330 290)"/>
  <!-- la lueur qui monte de la liqueur -->
  <ellipse cx="340" cy="520" rx="110" ry="90" fill="#7cf59a" opacity="0.25" filter="url(#flou)"/>

  <g fill="#c8ffd4" opacity="0.6">
    <circle cx="120" cy="300" r="2.5"/><circle cx="560" cy="240" r="2"/>
    <circle cx="90" cy="560" r="2"/><circle cx="600" cy="600" r="2.5"/>
    <circle cx="500" cy="120" r="2"/><circle cx="170" cy="640" r="2"/>
  </g>

  <rect width="680" height="1000" fill="url(#voile)"/>
  <rect width="680" height="1000" filter="url(#grain)"/>
</svg>
